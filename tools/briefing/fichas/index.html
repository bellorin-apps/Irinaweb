<!doctype html>
<html lang="es-MX" data-theme="light">

<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una sola columna centrada, secciones apiladas con navegación por pestañas pegajosa; pensada para responder desde el teléfono con un toque por respuesta. */
:root{
  --bg:#f7f5fa; --surface:#ffffff; --fg:#2b2730; --muted:#6d6577; --line:#e4dfea;
  --purple:#8c4eaa; --purple-soft:#f1e8f4; --teal:#3ca1a7; --teal-soft:#e4f3f4;
  --ok:#2e8b57; --warn:#b7791f; --shadow:0 1px 2px rgba(60,40,80,.06),0 8px 24px rgba(60,40,80,.06);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171420; --surface:#201c2a; --fg:#ece7f2; --muted:#a79fb3; --line:#352f42;
  --purple:#b48ad0; --purple-soft:#2b2238; --teal:#5fc4ca; --teal-soft:#1b3234;
  --ok:#5ec48a; --warn:#e0a94a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171420; --surface:#201c2a; --fg:#ece7f2; --muted:#a79fb3; --line:#352f42;
  --purple:#b48ad0; --purple-soft:#2b2238; --teal:#5fc4ca; --teal-soft:#1b3234;
  --ok:#5ec48a; --warn:#e0a94a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:0 96px;padding-inline:16px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--teal)}

header.top{padding-block:24px 16px;display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;flex:none}
.progress{display:grid;gap:6px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--teal));transition:width .3s ease}
.status{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-inline:-16px;padding-inline:16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
nav.tabs button .n{display:inline-block;min-width:1.4em;margin-left:6px;font-size:.75rem;opacity:.8;font-variant-numeric:tabular-nums}

section.panel{display:none;gap:20px;padding-block:16px}
section.panel.active{display:grid}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:grid;gap:14px}
.q{display:grid;gap:8px}
.q > label, .q > .qlabel{font-weight:700}
.hint{font-size:.85rem;color:var(--muted)}

.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:10px 14px;font:inherit;font-size:.95rem;font-weight:600;cursor:pointer;min-height:44px;text-align:left}
.choices button[aria-pressed="true"]{border-color:var(--purple);background:var(--purple-soft);color:var(--purple)}
.choices.teal button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.choices button:focus-visible,nav.tabs button:focus-visible,input:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.svc{display:grid;gap:8px}
.svc .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.svc .row:first-child{border-top:0}
.svc .row .name{font-weight:600;min-width:0}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 10px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;min-height:40px}
.seg button + button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{color:#fff}
.seg button[data-v="ofrece"][aria-pressed="true"],.seg button[data-v="realizo"][aria-pressed="true"]{background:var(--teal)}
.seg button[data-v="refiere"][aria-pressed="true"],.seg button[data-v="indico"][aria-pressed="true"]{background:var(--purple)}
.seg button[data-v="no"][aria-pressed="true"]{background:var(--muted)}
@media (max-width:460px){.svc .row{grid-template-columns:1fr}.seg{width:100%}.seg button{flex:1;text-align:center}}

input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:1rem;background:var(--surface);color:var(--fg)}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

.footer-bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:6}
.footer-bar .inner{width:100%;max-width:720px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.btn.primary{background:var(--purple);color:#fff}
.btn.ghost{background:transparent;color:var(--purple);border:1.5px solid var(--purple)}
.btn:disabled{opacity:.5;cursor:default}
.save{font-size:.8rem;color:var(--muted);min-width:0}
.save.ok{color:var(--ok)}
.save.warn{color:var(--warn)}

.note{border-left:3px solid var(--teal);background:var(--teal-soft);padding:10px 12px;border-radius:8px;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:7}
.toast.show{opacity:1}
pre.summary{white-space:pre-wrap;font:inherit;font-size:.9rem;background:var(--purple-soft);border-radius:10px;padding:12px;max-height:50vh;overflow:auto;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const TRI = [["ofrece","Ofrezco"],["refiere","Refiero"],["no","No"]];
const STUDY = [["realizo","Realizo"],["indico","Indico e interpreto"],["refiere","Refiero"],["no","No"]];

// ---------- Estado ----------
let answers = {};
const TOKEN = new URLSearchParams(location.search).get("t") || "";
let saveTimer = null, saving = false, pendingSave = false, current = 0;
const LS_KEY = "fichas-dra-irina-v1";

try { const d = localStorage.getItem(LS_KEY); if (d) answers = JSON.parse(d) || {}; } catch (e) {}

const $ = (s, el) => (el || document).querySelector(s);
const tabsEl = $("#tabs"), panelsEl = $("#panels"), toastEl = $("#toast");

function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(() => toastEl.classList.remove("show"), 2200); }

function answerable(it){ return it.type !== "group" && !it.optional; }
function isAnswered(it){
  const v = answers[it.id];
  if (v == null) return false;
  if (Array.isArray(v)) return v.length > 0;
  return String(v).trim() !== "";
}

// ---------- Render ----------
function build(){
  SECTIONS.forEach((sec, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.role = "tab"; b.id = "tab-" + sec.id; b.setAttribute("aria-controls", "panel-" + sec.id);
    b.innerHTML = sec.title + '<span class="n" id="n-' + sec.id + '"></span>';
    b.addEventListener("click", () => show(i));
    tabsEl.appendChild(b);

    const p = document.createElement("section");
    p.className = "panel"; p.id = "panel-" + sec.id; p.role = "tabpanel"; p.setAttribute("aria-labelledby", "tab-" + sec.id);
    const head = document.createElement("div");
    head.innerHTML = '<p class="eyebrow">Sección ' + (i + 1) + ' de ' + SECTIONS.length + '</p><h2>' + sec.title + '</h2>' + (sec.intro ? '<p class="muted small">' + sec.intro + '</p>' : '');
    p.appendChild(head);

    let card = null, svc = null;
    sec.items.forEach(it => {
      if (it.type === "group"){
        card = document.createElement("div"); card.className = "card";
        card.innerHTML = '<h3>' + it.q + '</h3>';
        svc = document.createElement("div"); svc.className = "svc"; card.appendChild(svc);
        p.appendChild(card); return;
      }
      if (it.type === "tri" || it.type === "study"){
        if (!svc){ card = document.createElement("div"); card.className = "card"; svc = document.createElement("div"); svc.className = "svc"; card.appendChild(svc); p.appendChild(card); }
        const row = document.createElement("div"); row.className = "row";
        row.innerHTML = '<div class="name">' + it.q + '</div>';
        const seg = document.createElement("div"); seg.className = "seg"; seg.setAttribute("role", "group"); seg.setAttribute("aria-label", it.q);
        (it.type === "tri" ? TRI : STUDY).forEach(([v, label]) => {
          const bt = document.createElement("button"); bt.type = "button"; bt.dataset.v = v; bt.textContent = label;
          bt.setAttribute("aria-pressed", answers[it.id] === v ? "true" : "false");
          bt.addEventListener("click", () => { answers[it.id] = v; [...seg.children].forEach(c => c.setAttribute("aria-pressed", c === bt ? "true" : "false")); changed(); });
          seg.appendChild(bt);
        });
        row.appendChild(seg); svc.appendChild(row); return;
      }
      svc = null;
      const c = document.createElement("div"); c.className = "card";
      const qd = document.createElement("div"); qd.className = "q";
      const lab = document.createElement(it.type === "text" || it.type === "textarea" ? "label" : "div");
      if (lab.tagName === "LABEL") lab.htmlFor = "f-" + it.id; else lab.className = "qlabel";
      lab.textContent = it.q + (it.optional ? "" : "");
      qd.appendChild(lab);
      if (it.hint){ const h = document.createElement("p"); h.className = "hint"; h.textContent = it.hint; qd.appendChild(h); }
      if (it.type === "single" || it.type === "multi"){
        const ch = document.createElement("div"); ch.className = "choices" + (it.type === "multi" ? " teal" : "");
        it.opts.forEach(o => {
          const bt = document.createElement("button"); bt.type = "button"; bt.textContent = o;
          const sel = it.type === "multi" ? (answers[it.id] || []).includes(o) : answers[it.id] === o;
          bt.setAttribute("aria-pressed", sel ? "true" : "false");
          bt.addEventListener("click", () => {
            if (it.type === "single"){ answers[it.id] = o; [...ch.children].forEach(c => c.setAttribute("aria-pressed", c === bt ? "true" : "false")); }
            else {
              let arr = Array.isArray(answers[it.id]) ? answers[it.id].slice() : [];
              const exclusive = ["Ninguna vigente","Ninguno","Ninguno por ahora","Nada, todo puede publicarse","No lo sé","Ninguno de estos"];
              if (arr.includes(o)) arr = arr.filter(x => x !== o);
              else { if (exclusive.includes(o)) arr = []; else arr = arr.filter(x => !exclusive.includes(x)); arr.push(o); }
              answers[it.id] = arr;
              [...ch.children].forEach(c => c.setAttribute("aria-pressed", arr.includes(c.textContent) ? "true" : "false"));
            }
            changed();
          });
          ch.appendChild(bt);
        });
        qd.appendChild(ch);
      } else {
        const inp = document.createElement(it.type === "textarea" ? "textarea" : "input");
        if (it.type === "text") inp.type = "text";
        inp.id = "f-" + it.id; inp.value = answers[it.id] || ""; inp.autocomplete = "off";
        inp.addEventListener("input", () => { answers[it.id] = inp.value; changed(true); });
        qd.appendChild(inp);
      }
      if (it.optional){ const o = document.createElement("p"); o.className = "hint"; o.textContent = "Opcional"; qd.appendChild(o); }
      c.appendChild(qd); p.appendChild(c);
    });

    if (i === SECTIONS.length - 1){
      const sum = document.createElement("div"); sum.className = "card";
      sum.innerHTML = '<h3>Resumen para enviar</h3><p class="hint">Si prefieres, copia este resumen y envíaselo a José por WhatsApp. Las respuestas también quedan guardadas aquí.</p><pre class="summary" id="summary"></pre><div class="choices"><button type="button" class="btn ghost" id="copyBtn">Copiar resumen</button></div>';
      p.appendChild(sum);
    }
    panelsEl.appendChild(p);
  });
  $("#copyBtn").addEventListener("click", copySummary);
  $("#prevBtn").addEventListener("click", () => show(current - 1));
  $("#nextBtn").addEventListener("click", () => show(current + 1));
}

function show(i){
  current = Math.max(0, Math.min(SECTIONS.length - 1, i));
  [...tabsEl.children].forEach((b, k) => b.setAttribute("aria-selected", k === current ? "true" : "false"));
  [...panelsEl.children].forEach((p, k) => p.classList.toggle("active", k === current));
  $("#prevBtn").disabled = current === 0;
  $("#nextBtn").textContent = current === SECTIONS.length - 1 ? "Fin" : "Siguiente";
  $("#nextBtn").disabled = current === SECTIONS.length - 1;
  tabsEl.children[current].scrollIntoView({ block: "nearest", inline: "center" });
  window.scrollTo({ top: 0 });
  try { localStorage.setItem(LS_KEY + "-tab", String(current)); } catch (e) {}
}

function updateProgress(){
  let total = 0, done = 0;
  SECTIONS.forEach(sec => {
    let t = 0, d = 0;
    sec.items.forEach(it => { if (answerable(it)){ t++; if (isAnswered(it)) d++; } });
    total += t; done += d;
    const n = $("#n-" + sec.id); if (n) n.textContent = d + "/" + t;
  });
  $("#bar").style.width = (total ? Math.round(done / total * 100) : 0) + "%";
  $("#count").textContent = done + " de " + total + " respondidas";
  renderSummary();
}

function label(it, v){
  if (it.type === "tri") return (TRI.find(x => x[0] === v) || [])[1] || v;
  if (it.type === "study") return (STUDY.find(x => x[0] === v) || [])[1] || v;
  return Array.isArray(v) ? v.join(", ") : v;
}
function summaryText(){
  const lines = ["BRIEFING — Dra. Irina González Sáez", "Fecha: " + new Date().toLocaleDateString("es-MX"), ""];
  SECTIONS.forEach(sec => {
    lines.push("## " + sec.title);
    sec.items.forEach(it => {
      if (it.type === "group"){ lines.push("· " + it.q); return; }
      if (isAnswered(it)) lines.push("- " + it.q + ": " + label(it, answers[it.id]));
    });
    lines.push("");
  });
  return lines.join("\n");
}
function renderSummary(){ const s = $("#summary"); if (s) s.textContent = summaryText(); }

function copySummary(){
  const text = summaryText();
  const fallback = () => { const s = $("#summary"); const r = document.createRange(); r.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Selecciona y copia el texto"); };
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(() => toast("Resumen copiado"), fallback); } else fallback();
}

// ---------- Guardado ----------
function setSave(txt, cls){ const a = $("#saveState"), b = $("#footState"); [a, b].forEach(el => { el.textContent = txt; el.className = "save" + (cls ? " " + cls : ""); }); }

function changed(debounceLong){
  updateProgress();
  try { localStorage.setItem(LS_KEY, JSON.stringify(answers)); localStorage.setItem(LS_KEY + "-at", new Date().toISOString()); } catch (e) {}
  setSave("Guardando…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, debounceLong ? 900 : 250);
}

async function persist(){
  if (saving){ pendingSave = true; return; }
  saving = true;
  try {
    const r = await fetch("guardar.php", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: TOKEN, answers, updatedAt: new Date().toISOString(), version: 1 }) });
    if (r.ok){ setSave("Guardado", "ok"); }
    else if (r.status === 403){ setSave("Enlace no válido; usa «Copiar resumen»", "warn"); }
    else { setSave("No se pudo guardar; usa «Copiar resumen»", "warn"); }
  } catch (e) {
    setSave("Sin conexión; se reintenta al guardar de nuevo", "warn");
  } finally {
    saving = false;
    if (pendingSave){ pendingSave = false; persist(); }
  }
}

async function connect(){
  if (!TOKEN){ setSave("Enlace sin token; usa «Copiar resumen»", "warn"); return; }
  try {
    const r = await fetch("guardar.php?token=" + encodeURIComponent(TOKEN), { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    if (d && d.answers && Object.keys(d.answers).length){
      const localEmpty = Object.keys(answers).length === 0;
      let remoteNewer = false;
      try { remoteNewer = !localEmpty && d.updatedAt && new Date(d.updatedAt) > new Date(localStorage.getItem(LS_KEY + "-at") || 0); } catch (e) { remoteNewer = true; }
      if (localEmpty || remoteNewer){ answers = d.answers; rebuild(); }
    }
    setSave("Guardado", "ok");
  } catch (e) { setSave("Guardado en este dispositivo", "warn"); }
}

function rebuild(){ tabsEl.innerHTML = ""; panelsEl.innerHTML = ""; build(); updateProgress(); show(current); }

build(); updateProgress();
let startTab = 0; try { startTab = parseInt(localStorage.getItem(LS_KEY + "-tab") || "0", 10) || 0; } catch (e) {}
show(startTab);
connect();
})();
</script>
